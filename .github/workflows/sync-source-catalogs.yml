name: Sync external RSS source catalogs

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 11:30 Asia/Shanghai (UTC+8)
    - cron: "30 3 * * 0"

concurrency:
  group: garss-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv

      - name: Install Pipenv
        run: python -m pip install pipenv==2026.8.0

      - name: Install locked dependencies
        run: pipenv sync --dev

      - name: Run tests
        run: pipenv run test

      - name: Sync source catalogs
        run: pipenv run sync-sources

      - name: Verify generated catalogs
        run: |
          test -s docs/api/v1/feed-candidates.json
          test -s docs/api/v1/rsshub-routes.json

      - name: Commit catalog changes
        run: |
          python scripts/check_publish_base.py
          git config user.email "1120873075@qq.com"
          git config user.name "garss-bot"
          git add docs/api/v1/feed-candidates.json docs/api/v1/rsshub-routes.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Update external RSS source catalogs"
            git push
          fi
