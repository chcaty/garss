name: Validate review submissions

on:
  pull_request:
    paths:
      - 'reviews/**'
      - 'sources.json'
      - 'scripts/apply-reviews.mjs'
      - 'scripts/lib/reviews.mjs'
      - 'garss/link_health.py'
      - 'scripts/check_feed_links.py'
      - 'docs/api/v1/review-schema.json'
      - 'docs/api/v1/review-decisions.json'
      - 'docs/assets/review/validation.mjs'
      - 'docs/assets/review/contract.mjs'
      - '.github/workflows/review-submissions.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check:review-schema
      - run: npm test
      - name: Validate candidates and preview inclusion
        run: npm run review:check -- --targets build/review-targets.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install pipenv==2026.8.0
      - run: pipenv sync
      - name: Require live RSS or Atom for new inclusions
        run: pipenv run python scripts/check_feed_links.py --input build/review-targets.json --require-valid
